<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied — DMT</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .box { max-width: 360px; }
    h1 { font-size: 22px; margin-bottom: 12px; }
    p { color: #aaa; font-size: 14px; line-height: 1.6; }
    a { color: #A100FF; text-decoration: none; display: inline-block; margin-top: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔒 Access Denied</h1>
    <p>Your account is not authorised to use this tool.<br>
    Contact the tool administrator to request access.</p>
    <a href="/.auth/logout">Sign out</a>
  </div>
</body>
</html>
